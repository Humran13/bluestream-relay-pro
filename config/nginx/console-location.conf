    # BlueStream web console (reverse proxy to the loopback-only Gunicorn).
    #
    # nginx is the ONLY trusted proxy. It overwrites the forwarded headers from
    # its own trusted values; raw client-provided forwarding headers are never
    # passed through. This matches ProxyFix(x_for=1, x_proto=1, x_host=1).
    location ^~ /console/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        # GUI-1C.1/GUI-2C media uploads: allow large console request bodies up
        # to the BlueStream upload cap (default 10 GiB). The directive is
        # rendered from the SINGLE authoritative MAX_MEDIA_UPLOAD_MB value in
        # server.conf at install/update time (see nginx_gen_config); it is
        # never edited here. Scoped ONLY to this /console/ location; other
        # sites/services keep nginx defaults.
        __CLIENT_MAX_BODY_SIZE__

        # Authenticated console pages must never be cached.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma no-cache always;
    }

    # /console (no trailing slash) redirects cleanly to /console/.
    location = /console {
        return 301 /console/;
    }
