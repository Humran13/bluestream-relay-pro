    # When HTTPS is active, the HTTP server block must never serve the web
    # console (Secure cookies cannot be issued over plain HTTP). Redirect all
    # console traffic to the HTTPS equivalent.
    location ^~ /console/ {
        return 301 https://$host$request_uri;
    }

    # /console (no trailing slash) redirects to the HTTPS console root.
    location = /console {
        return 301 https://$host/console/;
    }
