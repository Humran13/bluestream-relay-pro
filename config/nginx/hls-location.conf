    # BlueStream HLS output location.
    # Served with correct MIME types, sensible cache headers and CORS.
    location ^~ /hls/ {
        alias __HLS_ROOT__/;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        default_type application/vnd.apple.mpegurl;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Range, Accept" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;

        # The live playlist must never be cached.
        location ~ \.m3u8$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Range, Accept" always;
            add_header Cache-Control "no-cache, no-store" always;
            expires -1;
        }

        # Media segments are immutable once written; cache them for a day.
        location ~ \.ts$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Range, Accept" always;
            add_header Cache-Control "public, max-age=86400" always;
            expires 1d;
            access_log off;
        }
    }
