{% extends "base.html" %}
{% block title %}Upload Media - BlueStream Relay Pro{% endblock %}
{% block content %}
<h1>Upload Media</h1>
<section class="card">
  <form method="post" action="{{ url_for('console.media_upload_post') }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="media">Video file</label>
    <input type="file" id="media" name="media" required>
    <p class="muted">Allowed formats: .mp4 .mkv .mov .webm .m4v .ts. Upload limit: {{ human_size(max_upload) }}.</p>
    <button type="submit" class="btn">Upload</button>
  </form>
</section>
<p><a href="{{ url_for('console.media') }}">&laquo; Back to Media Library</a></p>
{% endblock %}
