name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (Flask/Werkzeug + pytest)
        run: pip install -r webapp/requirements-dev.txt
      - name: Compile check
        run: python -m py_compile webapp/app.py webapp/test_console.py webapp/test_install.py webapp/test_playlist_normalize.py
      - name: Run webapp test suite
        working-directory: webapp
        run: python -m pytest -q

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./node_modules/*")
          exit "$fail"
      - name: ShellCheck (error level only)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error
          ignore_paths: node_modules

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Run player.js unit tests
        run: node --test web/*.test.js

  browser:
    runs-on: ubuntu-latest
    needs: node
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install Playwright (locked versions via package-lock.json)
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser player URL tests (bundled engines only in CI)
        run: npx playwright test -c tests/browser/playwright.config.js --project=chromium --project=firefox --project=webkit
