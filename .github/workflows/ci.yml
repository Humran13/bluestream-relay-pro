name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install FFmpeg + fonts + tzdata (Studio media tests)
        timeout-minutes: 14
        run: |
          {
            echo 'Acquire::Retries "3";'
            echo 'Acquire::http::Timeout "30";'
            echo 'DPkg::Lock::Timeout "180";'
          } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            if timeout 330 sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core tzdata; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install pinned dependencies (Flask/Werkzeug + pytest)
        run: pip install -r webapp/requirements-dev.txt
      - name: Compile check
        run: python -m py_compile webapp/app.py webapp/test_console.py webapp/test_install.py webapp/test_playlist_normalize.py
      - name: Run webapp test suite
        working-directory: webapp
        run: python -m pytest -q

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n syntax check
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./node_modules/*")
          exit "$fail"
      - name: ShellCheck (error level only)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          severity: error
          ignore_paths: node_modules

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Run player.js unit tests
        run: node --test web/*.test.js

  browser:
    runs-on: ubuntu-24.04
    needs: node
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install Playwright (locked versions via package-lock.json)
        timeout-minutes: 19
        run: |
          # apt mirror downloads can stall indefinitely on hosted runners:
          # bound each apt request and retry the whole install a few times.
          {
            echo 'Acquire::Retries "3";'
            echo 'Acquire::http::Timeout "30";'
            echo 'DPkg::Lock::Timeout "180";'
            echo 'Acquire::https::Timeout "30";'
          } | sudo tee /etc/apt/apt.conf.d/99ci-timeouts >/dev/null
          npm ci
          for attempt in 1 2 3; do
            if timeout 360 npx playwright install --with-deps chromium firefox webkit; then
              exit 0
            fi
            echo "Playwright install attempt $attempt failed or timed out" >&2
            # timeout kills npx but not its apt-get child, which would keep the dpkg lock
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 5
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Run cross-browser player URL tests (bundled engines only in CI)
        run: npx playwright test -c tests/browser/playwright.config.js --project=chromium --project=firefox --project=webkit
